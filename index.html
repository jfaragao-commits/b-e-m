<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.E.M. — Acesso ao Treinamento</title>
<style>
:root {
  --bg: #0c0c0c;
  --panel: #111111;
  --line: #2a2a2a;
  --text: #e4e0d8;
  --muted: #88847c;
  --gold: #c8a030;
}
* { box-sizing: border-box; }
body {
  margin: 0; 
  background: var(--bg); 
  color: var(--text);
  font-family: "Courier New", monospace; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  min-height: 100vh;
}
.login-box {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 25px 70px rgba(0,0,0,.5);
}
.logo-container {
  text-align: center;
  margin-bottom: 30px;
}
.logo {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: var(--text);
  color: #0c0c0c;
  display: inline-grid;
  place-items: center;
  font-weight: 900;
  font-size: 16px;
  margin-bottom: 10px;
}
h2 {
  font-size: 20px;
  margin: 0 0 5px;
  letter-spacing: -1px;
}
.sub {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 25px;
}
.input-group {
  margin-bottom: 18px;
}
label {
  display: block;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
input {
  width: 100%;
  padding: 12px;
  background: #000;
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  outline: none;
}
input:focus {
  border-color: var(--gold);
}
.btn {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: center;
  padding: 14px;
  margin-top: 10px;
  border: 1px solid var(--gold);
  background: var(--gold);
  color: #0c0c0c;
  font-weight: bold;
  letter-spacing: 1px;
  font-family: inherit;
  cursor: pointer;
  transition: .2s;
}
.btn:hover {
  filter: brightness(1.08);
}
.actions {
  margin-top: 20px;
  text-align: center;
  font-size: 12px;
}
.actions a {
  color: var(--muted);
  text-decoration: none;
}
.actions a:hover {
  color: var(--text);
}
.error-msg {
  color: #b84848;
  font-size: 12px;
  margin-top: 10px;
  text-align: center;
  display: none;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo-container">
    <div class="logo">BEM</div>
    <h2>ACESSO AO APP</h2>
    <div class="sub">TREINAMENTO AUDITIVO</div>
  </div>

  <div class="input-group">
    <label>E-MAIL</label>
    <input type="email" id="email" placeholder="seu@email.com" required>
  </div>

  <div class="input-group">
    <label>SENHA</label>
    <input type="password" id="password" placeholder="••••••••" required>
  </div>

  <button class="btn" id="loginBtn">ENTRAR →</button>
  <div id="errorMsg" class="error-msg"></div>

  <div class="actions">
    <a href="#" id="resetBtn">Esqueci minha senha</a>
  </div>
</div>

<script type="module">
  // IMPORTANTE: Insira as credenciais do seu projeto Firebase abaixo
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "SEU_MESSAGING_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginBtn = document.getElementById("loginBtn");
  const resetBtn = document.getElementById("resetBtn");
  const errorMsg = document.getElementById("errorMsg");

  // Função de Login (Apenas Entrar)
  loginBtn.addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    
    errorMsg.style.display = "none";
    loginBtn.innerText = "CARREGANDO...";

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        // Sucesso: Redirecionar para o painel de estudos do B.E.M.
        window.location.href = "painel.html"; 
      })
      .catch((error) => {
        loginBtn.innerText = "ENTRAR →";
        errorMsg.style.display = "block";
        errorMsg.innerText = "Credenciais inválidas. Verifique seu e-mail e senha.";
      });
  });

  // Função de Redefinir Senha
  resetBtn.addEventListener("click", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    
    if(!email) {
      errorMsg.style.display = "block";
      errorMsg.innerText = "Digite seu e-mail acima para redefinir a senha.";
      return;
    }

    sendPasswordResetEmail(auth, email)
      .then(() => {
        errorMsg.style.display = "block";
        errorMsg.style.color = "#4a9e6a"; // Cor verde
        errorMsg.innerText = "E-mail de redefinição enviado!";
      })
      .catch((error) => {
        errorMsg.style.display = "block";
        errorMsg.style.color = "#b84848"; // Cor vermelha
        errorMsg.innerText = "Erro ao enviar e-mail. Verifique se o endereço está correto.";
      });
  });
</script>

</body>
</html>
